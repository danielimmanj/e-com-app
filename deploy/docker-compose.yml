services:

  # Zookeeper Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 10"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - e-commerce

  # Kafka Service
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 40"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - e-commerce

  # PostgreSQL Service for eCommerce
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: eCommerce
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Schema.txt:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d eCommerce"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - e-commerce

  # PostgreSQL Service for Keycloak
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - e-commerce

  # Keycloak Service
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: keycloak

    # Recommended for local development
    command: start-dev --import-realm

    environment:
      KC_HEALTH_ENABLED: "true"

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

    ports:
      - "8081:8080"

    depends_on:
      - keycloak-postgres

    restart: unless-stopped

    volumes:
      - ./keycloak/import:/opt/keycloak/data/import

    networks:
      - e-commerce

  # Elasticsearch Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

      # Security enabled
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=elastic

    ulimits:
      memlock:
        soft: -1
        hard: -1

    volumes:
      - esdata:/usr/share/elasticsearch/data

    ports:
      - "9200:9200"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:elastic 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

    restart: unless-stopped

    networks:
      - e-commerce

  # Logstash Service
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: logstash

    command: logstash -f /usr/share/logstash/pipeline/logstash.conf --log.level info

    environment:
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: elastic

    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logstash/logs:/var/logs/eCommerce

    ports:
      - "5044:5044"
      - "9600:9600"

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - e-commerce

  # Kibana Service
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=elastic

    ports:
      - "5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - e-commerce

  # Prometheus Service
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    restart: unless-stopped

    networks:
      - e-commerce

  # Grafana Service
  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped

    networks:
      - e-commerce

  # PostgreSQL Exporter
  postgres-exporter:
    image: bitnami/postgres-exporter:latest
    container_name: postgres-exporter

    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin@postgres:5432/eCommerce?sslmode=disable"

    ports:
      - "9187:9187"

    depends_on:
      - postgres

    restart: unless-stopped

    networks:
      - e-commerce

  eureka-server:
    container_name: eureka-server
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks:
      - e-commerce

  api-gateway:
    container_name: api-gateway
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    depends_on:
      - eureka-server
      - keycloak
      - product-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      PRODUCT_SERVICE_URL: http://product-service:8086
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/e-commerce
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/e-commerce
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/e-commerce/protocol/openid-connect/certs
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - e-commerce

  security:
    container_name: security
    build:
      context: ../security
      dockerfile: Dockerfile
    depends_on:
      - eureka-server
      - keycloak
      - kafka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/e-commerce
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/e-commerce
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - e-commerce

  user-service:
    container_name: user-service
    build:
      context: ../user-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eCommerce
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"
    restart: unless-stopped
    networks:
      - e-commerce

  order-service:
    container_name: order-service
    build:
      context: ../order-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eCommerce
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8085:8085"
    restart: unless-stopped
    networks:
      - e-commerce

  product-service:
    container_name: product-service
    build:
      context: ../product-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eCommerce
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8086:8086"
    restart: unless-stopped
    networks:
      - e-commerce

  inventory-service:
    container_name: inventory-service
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eCommerce
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8087:8087"
    restart: unless-stopped
    networks:
      - e-commerce

  payment-service:
    container_name: payment-service
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eCommerce
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    ports:
      - "8088:8088"
    restart: unless-stopped
    networks:
      - e-commerce

  shipping-service:
    container_name: shipping-service
    build:
      context: ../shipping-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eCommerce
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8089:8089"
    restart: unless-stopped
    networks:
      - e-commerce

  shopfront-ui:
    container_name: shopfront-ui
    build:
      context: ../shopfront-ui
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
      - keycloak
    ports:
      - "4200:80"
    restart: unless-stopped
    networks:
      - e-commerce

networks:
  e-commerce:
    driver: bridge

volumes:
  esdata:
    driver: local

  postgres_data:
    driver: local

  keycloak_postgres_data:
    driver: local