name: Trigger auto deployment for eurekaserver

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      - appmod/java-upgrade-20260517153940
    paths:
      - 'eureka-server/**'
      - '.github/workflows/eurekaserver-AutoDeployTrigger-6ef279ba-bb3c-4c18-bf2e-0c39ac6622bf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.EUREKASERVER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EUREKASERVER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EUREKASERVER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/eureka-server
          dockerfilePath: Dockerfile
          registryUrl: ${{ secrets.EUREKASERVER_REGISTRY_URL }}
          registryUsername: ${{ secrets.EUREKASERVER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.EUREKASERVER_REGISTRY_PASSWORD }}
          containerAppName: eurekaserver
          resourceGroup: ecom-rg
          imageToBuild: ${{ secrets.EUREKASERVER_REGISTRY_URL }}/eurekaserver:${{ github.sha }}
          targetPort: 8761
          ingress: external
